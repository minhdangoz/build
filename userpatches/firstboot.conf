# Board-aware first-boot presets for the TV-box images built by this tree.
#
# lib/functions/rootfs/distro-agnostic.sh copies this file to
# /root/.not_logged_in_yet inside the image. /usr/lib/armbian/armbian-firstlogin
# sources it and, for every PRESET_* value it finds, skips the matching prompt.
# With all of them set the box goes straight to a usable login.
#
# ⚠️ These are development defaults, not secure ones. Change the two passwords
# below before this box goes anywhere near an untrusted network, or run
# `passwd` on the device after first boot.

# Resolve the board at runtime. This file is shared by every image build, so
# account identity must never be hard-coded globally. /etc/armbian-release is
# generated by the board-specific BSP package and contains BOARD=km7/tx68.
if [[ -r /etc/armbian-release ]]; then
	# shellcheck disable=SC1091
	source /etc/armbian-release
fi

# --- Tài khoản ---
case "${BOARD:-}" in
	km7)
		PRESET_USER_NAME="km7"
		PRESET_USER_PASSWORD="km7"
		PRESET_DEFAULT_REALNAME="KM7"
		PRESET_ROOT_PASSWORD="km7"
		;;
	tx68)
		# TX68 currently creates this account in its board hook and removes
		# the wizard. Keep the correct fallback if that policy changes.
		PRESET_USER_NAME="tx68"
		PRESET_USER_PASSWORD="tx68"
		PRESET_DEFAULT_REALNAME="TX68"
		PRESET_ROOT_PASSWORD="tx68"
		;;
esac

PRESET_USER_SHELL="bash"

# --- Vùng miền ---
# SET_LANG_BASED_ON_LOCATION only has to be non-empty to suppress the
# "set language based on your location?" prompt; it is never compared to "yes".
PRESET_LOCALE="en_US.UTF-8"
PRESET_TIMEZONE="Asia/Ho_Chi_Minh"
SET_LANG_BASED_ON_LOCATION="n"

# --- Mạng ---
# 0 = leave networking exactly as the image ships it (DHCP on end0). Set this to
# 1 only if you actually want the static-IP / WiFi PRESET_NET_* keys applied;
# with it at 0 they are ignored entirely.
PRESET_NET_CHANGE_DEFAULTS=0
