# Allwinner H618 quad core 2/4GB RAM SoC TV box (m1k_go), AXP1530 PMIC, eMMC-only, no microSD slot
BOARD_NAME="TX68"
BOARD_VENDOR="oranth"
BOARDFAMILY="sun50iw9"
BOARD_MAINTAINER=""
INTRODUCED="2026"
BOOT_FDT_FILE="allwinner/sun50i-h616-tx68.dtb"
BOOT_LOGO="desktop"

# TV box: no wizard, ever (see post_family_tweaks__tx68 below, which removes
# the armbian-firstlogin trigger file entirely). Root password baked in
# directly instead of shipping with the framework default (1234) and relying
# on the wizard to change it -- there IS no wizard to change it. Keep this in
# sync with PRESET_ROOT_PASSWORD/PRESET_USER_PASSWORD in
# userpatches/firstboot.conf (unused for this board now, but documents the
# same intent) and with the useradd block below.
ROOTPWD="tx68"

# TV box: nobody wants a setup wizard on a TV. The account/locale prompts are
# preseeded by userpatches/firstboot.conf, and this drops GNOME straight to the
# desktop instead of a greeter.
#
# DESKTOP_AUTOLOGIN only covers GDM (the graphical session). It does NOT touch
# the text consoles (tty1, serial ttyS0) -- those are a separate knob,
# CONSOLE_AUTOLOGIN, in lib/functions/rootfs/distro-agnostic.sh. Without it,
# a getty on tty1 still prompts for a login before GDM ever starts, which is
# exactly the stray login prompt seen on real hardware before the desktop
# session appeared. Both must be "yes" for a TV box that boots straight to
# desktop with no keyboard attached.
declare -g DESKTOP_AUTOLOGIN="yes"
declare -g CONSOLE_AUTOLOGIN="yes"

# net-tools is not in the default rootfs, so `ifconfig` is missing on a fresh
# image. `ip` covers everything it does, but muscle memory is muscle memory.
PACKAGE_LIST_BOARD="net-tools"
OVERLAY_PREFIX="sun50i-h616"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
FORCE_BOOTSCRIPT_UPDATE="yes"

# sun50iw9.conf unconditionally sets GOVERNOR=ondemand (source_family_config_and_arch
# runs after board config, so a plain assignment here would just get overwritten).
# Override it in the post_family_config hook instead. TX68 is a mains-powered TV
# box with no battery, so there's no downside to just running the CPU at its
# validated max OPP (1416 MHz @ 1100 mV, see docs/TX68_HARDWARE.md §2) all the
# time instead of ramping under ondemand's sampling delay. This is a pure
# software/governor change -- no DTS, no voltage, no new OPP entries -- so it
# carries none of the risk an actual frequency overclock would.
function post_family_config__tx68_performance_governor() {
	declare -g GOVERNOR="performance"
}

# TX68 boots through Allwinner secure boot: Boot0 and U-Boot are signed
# against the vendor m1k_go key set and verified by the BootROM/Boot0 chain
# (see /media/jimmy/WORK/AOSP/orangepi-build/docs/TX68_PORTING.md). Mainline
# U-Boot is NOT flashed to this board and cannot replace that chain. This
# profile is only used to build the Linux kernel, this DTB, and the rootfs —
# BOOTCONFIG is set to Orange Pi Zero 3's so the U-Boot compile step in a
# normal `compile.sh` run succeeds, but its output is discarded; the real
# boot chain stays the verified vendor Boot0 + vendor U-Boot + secure TOC1,
# and only the Armbian-built Image/dtb/modules/rootfs get packaged into that
# chain by orangepi-build's tx68-build-phoenix-image.sh.
BOOTCONFIG="orangepi_zero3_defconfig"

# WiFi/BT is an AIC8800-family SDIO chip (confirmed AIC8801 on real hardware,
# see the note below — NOT AIC8800DC despite the vendor Android BSP directory
# name), NOT the UWE5622 that orangepizero3.csc enables — do not
# enable_extension "uwe5622-allwinner" here, it is the wrong chip and was
# already ruled out on real TX68 hardware.
#
# The Radxa DKMS package carries the same three modules the vendor tree has
# (aic8800_bsp, aic8800_fdrv, aic8800_btlpm — so Bluetooth is covered too).
# Verified working end-to-end on real hardware (WiFi scan/associate/DHCP,
# Bluetooth hci0 responds to HCI commands) after the three fixes below.
#
# The DT side lives in patch/kernel/archive/sunxi-6.18/dt_64/sun50i-h616-tx68.dts
# (&mmc1 + wifi_pwrseq on PG18, and &uart1 for the BT UART).
declare -g AIC8800_TYPE="sdio"
enable_extension "radxa-aic8800"

# Confirmed on real hardware (SDIO probe log): this board's chip reports
# vid:did 0x5449:0x0145 -> aicwf_sdio_chipmatch() resolves that to
# PRODUCT_ID_AIC8801, chip_rev U03/U04 -- i.e. the DKMS driver treats it as
# a plain AIC8801, NOT AIC8800DC as the vendor Android BSP directory name
# suggested. Firmware for that combination lives under
# /lib/firmware/aic8800_fw/SDIO/aic8800/ (bare, no D80/DC suffix).
#
# Three bugs had to be fixed to get WiFi+BT working, all found by reading
# the DKMS package's own source (SDIO/driver_fw/driver/aic8800/):
#  1. aic8800_bsp_sdio's own aic_fw_path module_param defaults to "" (empty)
#     -- it is only used by get_fw_path()'s fallback default which is
#     hardcoded for 8800D80, so the BT patch-table load
#     (aicbt_patch_table_alloc) always failed with the true firmware
#     silently missing. Fixed by /etc/modprobe.d/aic8800.conf below.
#  2. That module reads the firmware with filp_open(), not
#     request_firmware() (CONFIG_USE_FW_REQUEST is not defined in this
#     build) -- aic_fw_path MUST therefore be an ABSOLUTE path, not the
#     /lib/firmware-relative style used elsewhere in the same driver.
#  3. aic8800_btlpm's platform_driver ("allwinner,sunxi-btlpm", see the
#     bt-lpm DT node in the .dts) failed to probe because GPIO PG16
#     (bt_hostwake) was already held by a completely unrelated, always-on
#     UNISOC WCN "marlin" driver compiled straight into the kernel
#     (CONFIG_WCN_BSP_DRIVER_BUILDIN=y, for the UWE5622 chip this board
#     does NOT have) -- confirmed via `cat /sys/kernel/debug/gpio` showing
#     gpio-208 held by consumer "bt-wake-host-gpio" at boot, long before
#     our driver ever loads. Fixed in config/kernel/linux-sunxi64-current.config
#     (CONFIG_WCN_BSP_DRIVER_BUILDIN, CONFIG_WLAN_UWE5621/5622,
#     CONFIG_UNISOC_WIFI_PS all disabled).
function post_family_tweaks__tx68() {
	display_alert "${BOARD}" "aic8800 fw path + BT service + X11 default" "info"

	mkdir -p "${SDCARD}"/etc/modprobe.d
	cat <<- 'AIC8800_MODPROBE' > "${SDCARD}"/etc/modprobe.d/aic8800.conf
		options aic8800_bsp_sdio aic_fw_path=/lib/firmware/aic8800_fw/SDIO/aic8800
	AIC8800_MODPROBE

	# The fd650 driver's fd650_debug module param defaults to 1 (see
	# patch/kernel/archive/sunxi-6.18/patches.armbian/drv-vfd-add-fd650.patch,
	# pr_dbg macro), which logs an open+close line at KERN_ALERT every time
	# /dev/fd650_dev is opened. tx68-fd650-clock.service (below) opens it
	# roughly once a second forever, so within a few hours this floods the
	# kernel ring buffer and evicts real boot-time messages (confirmed live:
	# `dmesg` on a 3h-uptime box showed nothing but FD650 open/close spam --
	# had to use `journalctl -k -b` instead, which isn't ring-buffer-limited,
	# to see the actual GPU/DRM boot log). Disabling it here doesn't touch
	# the driver's functionality, only this debug logging.
	cat <<- 'FD650_MODPROBE' > "${SDCARD}"/etc/modprobe.d/fd650.conf
		options fd650 fd650_debug=0
	FD650_MODPROBE

	if [[ -f "${SDCARD}/lib/modules/"*"/updates/dkms/aic8800_btlpm_sdio.ko" || -d "${SDCARD}/var/lib/dkms/aic8800-sdio" ]]; then
		chroot_sdcard_apt_get_install bluez rfkill
		run_host_command_logged install -m 644 "${SRC}/packages/bsp/sunxi/aic8800-bluetooth.service" "${SDCARD}/lib/systemd/system/aic8800-bluetooth.service"
		chroot_sdcard systemctl --no-reload enable aic8800-bluetooth.service
	fi

	# User wants X11 + XFCE over Wayland + GNOME (GNOME/Wayland is too heavy
	# for this box). XFCE itself is X11-only and is a separate DESKTOP_ENVIRONMENT
	# build choice (see tx68/README.md); this line covers the GNOME case too,
	# forcing gdm3 to only ever offer/default to the Xorg session. Also sets
	# permanent GDM autologin as the "tx68" user -- see the wizard-skip block
	# below for why this has to be done here instead of by armbian-firstlogin
	# (which normally writes this same AutomaticLogin block, but only after
	# a human answers its prompts, and only for 20s unless
	# /root/.desktop_autologin is present -- see armbian-firstlogin's gdm3
	# branch. Writing it here directly and skipping the wizard makes it
	# permanent with zero interaction, which is what a TV box needs).
	if [[ -d "${SDCARD}/etc/gdm3" || "${DESKTOP_ENVIRONMENT}" == "gnome" ]]; then
		mkdir -p "${SDCARD}"/etc/gdm3
		cat <<- 'GDM_X11' > "${SDCARD}"/etc/gdm3/custom.conf
			[daemon]
			WaylandEnable=false
			AutomaticLoginEnable=true
			AutomaticLogin=tx68
		GDM_X11

		# armbian-configng's gnome.sh postinst (00-bg, see
		# cache/sources/armbian-configng/tools/modules/desktops/postinst/gnome.sh)
		# already disables idle *suspend* (sleep-inactive-ac-timeout=0) but never
		# touches idle-delay/lock-enabled, so GNOME still blanks the screen and
		# drops to the lock screen on its own timer. This box has no keyboard --
		# a lock screen with no way to unlock it (no user ever typed the tx68
		# password once, since GDM autologs in) would strand the FD650/kiosk UI
		# behind an unrecoverable prompt. 02- sorts after upstream's 00-bg so it
		# wins; dconf takes the last value on key conflicts within local.d.
		mkdir -p "${SDCARD}"/etc/dconf/db/local.d
		cat <<- 'DCONF_NOLOCK' > "${SDCARD}"/etc/dconf/db/local.d/02-tx68-no-lock
			[org/gnome/desktop/session]
			idle-delay=uint32 0

			[org/gnome/desktop/screensaver]
			idle-activation-enabled=false
			lock-enabled=false

			[org/gnome/desktop/lockdown]
			disable-lock-screen=true

			[org/gnome/settings-daemon/plugins/power]
			sleep-inactive-ac-timeout=0
			sleep-inactive-ac-type='nothing'
			sleep-inactive-battery-timeout=0
			sleep-inactive-battery-type='nothing'
		DCONF_NOLOCK
		chroot_sdcard "dconf update"
	fi

	# Pre-create the "tx68" user account at build time and skip
	# armbian-firstlogin entirely (see below). Normally this account, its
	# password, its group membership, and the GDM autologin config above are
	# all set up interactively by /usr/lib/armbian/armbian-firstlogin on
	# first console login -- fine for a desktop/server, wrong for a TV box
	# with no keyboard attached: it either hangs waiting for input that
	# never comes, or (with firstboot.conf presets) still leaves a "tx68
	# login:" prompt on tty1 the first time, because CONSOLE_AUTOLOGIN's
	# getty override is deliberately deleted by armbian-firstlogin the
	# moment it runs (see the "disable autologin" block near the top of
	# that script) -- it's a one-shot wizard-entry mechanism upstream,
	# never meant to survive past the first login. Replicating add_user()'s
	# relevant steps here (group list matches it exactly) and never letting
	# the wizard run at all means CONSOLE_AUTOLOGIN's getty override is
	# never deleted, so tty1/serial autologin as root also stays permanent.
	chroot_sdcard "useradd --create-home --home-dir /home/tx68 --shell /bin/bash --comment TX68 --user-group tx68 || true"
	chroot_sdcard "echo 'tx68:tx68' | chpasswd"
	chroot_sdcard "for g in sudo netdev audio video disk tty users games dialout plugdev input bluetooth systemd-journal ssh render docker; do getent group \"\$g\" >/dev/null && usermod -aG \"\$g\" tx68; done; true"
	rm -f "${SDCARD}"/root/.not_logged_in_yet "${SDCARD}"/root/.desktop_autologin

	# eMMC auto-expand: see the BOARD==tx68 branches added to
	# packages/bsp/common/usr/lib/armbian/armbian-resize-filesystem, ported
	# from orangepi-build's orangepi-resize-filesystem (already fixed and
	# tested there for this exact board). No board-specific packaging step
	# needed here -- armbian-resize-filesystem.service is enabled for every
	# board by distro-agnostic.sh already.

	# Front-panel FD650 (PI11/PI12, see the "fd650" node in
	# sun50i-h616-tx68.dts and CONFIG_VFD/CONFIG_FD650 in
	# linux-sunxi64-current.config). The out-of-tree fd650 driver creates
	# /dev/fd650_dev once it probes.
	#
	# KM7 (S4/S905Y4) carries the same physical FD650 module on its own
	# front panel, on a completely different kernel driver (Amlogic's
	# LED-class driver in amlogic-led.ko, /sys/class/leds/fd650/*).
	# fd650ctl and the rotation script are therefore shared, with the
	# board-detecting code in packages/bsp/common/ (see docs/FD650.md), not
	# copies under packages/bsp/sunxi/ -- only the device-specific glue (udev rule,
	# polkit unit name, systemd unit device path) is per-board. See
	# config/boards/km7.csc's post_family_tweaks__km7_enable_front_panel
	# for the KM7 side of this same install.
	#
	# fd650ctl is the single place that knows the low-level write protocol
	# for whichever backend is detected -- both the CLI and the rotation
	# service below call it instead of each re-implementing the display
	# write themselves. On TX68's chardev backend that packing is not
	# obvious: the \NNN octal escapes MUST be literal characters in
	# printf's format string, not substituted through a separate %s
	# argument, or the driver silently reads garbage into
	# dot_fg/brightness (verified: an earlier %s-based version always fell
	# through to the driver's default brightness case regardless of what
	# was requested). See the comment on raw_write() in fd650ctl itself.
	#
	# 99-fd650.rules group-owns /dev/fd650_dev to "video" (the desktop
	# user is already a member, see the useradd block above) so fd650ctl
	# works without sudo -- this is meant to be usable interactively by
	# whoever is running the box, not just root.
	run_host_command_logged install -m 755 "${SRC}/packages/bsp/common/usr/local/bin/fd650ctl" "${SDCARD}/usr/local/bin/fd650ctl"
	run_host_command_logged install -m 644 "${SRC}/packages/bsp/sunxi/99-fd650.rules" "${SDCARD}/etc/udev/rules.d/99-fd650.rules"

	# `fd650ctl daemon start/stop/restart` needs its own grant --
	# org.freedesktop.systemd1.manage-units is polkit-gated by default even
	# for a group that already owns the device node. Scoped to exactly
	# this board's unit name plus KM7's (see the rule file itself for why:
	# manage-units is otherwise "control any system service", far too
	# broad to hand to "video"). Shared file since both boards' unit names
	# are whitelisted in the same rule.
	run_host_command_logged install -m 644 "${SRC}/packages/bsp/common/49-fd650-clock.rules" "${SDCARD}/etc/polkit-1/rules.d/49-fd650-clock.rules"

	# Default behavior: rotate between clock and CPU temperature at
	# brightness 1 (the chip's dimmest of 8 fixed PWM levels -- confirmed
	# on real hardware there is no dimmer software-controllable step;
	# see docs/TX68_HARDWARE.md §11.2). Override via
	# FD650_BRIGHTNESS/FD650_TIME_SECONDS/FD650_TEMP_SECONDS environment
	# in the unit if a user wants different timing.
	run_host_command_logged install -m 755 "${SRC}/packages/bsp/common/usr/local/bin/fd650-clock-rotate" "${SDCARD}/usr/local/bin/fd650-clock-rotate"
	run_host_command_logged install -m 644 "${SRC}/packages/bsp/sunxi/tx68-fd650-clock.service" "${SDCARD}/lib/systemd/system/tx68-fd650-clock.service"
	chroot_sdcard systemctl --no-reload enable tx68-fd650-clock.service

	# Remote desktop: this box normally runs headless (no keyboard/mouse
	# attached, per the autologin/no-wizard setup above), so GUI access has
	# to come over the network. x11vnc mirrors the real X11 display (the
	# GNOME session GDM autologs into above) rather than starting a second
	# display like a VNC-over-Xvnc setup would, so what you see is exactly
	# what's on the box. openssh-server is installed explicitly rather than
	# relying on it being pulled in already, since DESKTOP_TIER=mid's
	# package set (armbian-configng yaml) doesn't guarantee it.
	chroot_sdcard_apt_get_install openssh-server x11vnc

	# Password lives in /etc/x11vnc.pass, matching the tx68/tx68 console
	# account's own security posture (LAN-only box, see useradd block
	# above) -- change both after first boot if this device is ever
	# exposed beyond a trusted LAN. x11vnc -storepasswd never touches
	# argv, so the password isn't visible via /proc/<pid>/cmdline on other
	# users' sessions during the build.
	chroot_sdcard "x11vnc -storepasswd tx68 /etc/x11vnc.pass"
	run_host_command_logged install -m 644 "${SRC}/packages/bsp/sunxi/tx68-x11vnc.service" "${SDCARD}/lib/systemd/system/tx68-x11vnc.service"
	chroot_sdcard systemctl --no-reload enable tx68-x11vnc.service ssh.service
}
